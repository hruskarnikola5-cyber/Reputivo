<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reputivo | Dein KI-Assistent für Google-Bewertungen</title>
<meta name="description" content="Reputivo erkennt neue Google-Bewertungen, erstellt professionelle Antwortvorschläge und sendet sie dir direkt auf WhatsApp – zur Prüfung und Freigabe. Für lokale Unternehmen, Restaurants und Dienstleister."/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="https://reputivo.de/"/>
<meta property="og:title" content="Reputivo | Dein KI-Assistent für Google-Bewertungen"/>
<meta property="og:description" content="Reputivo erkennt neue Google-Bewertungen, erstellt professionelle Antwortvorschläge und sendet sie dir direkt auf WhatsApp."/>
<meta property="og:type" content="website"/>
<style>
:root{--bg:#f5f7fb;--panel:rgba(255,255,255,0.72);--stroke:rgba(15,23,42,0.08);--text:#101828;--muted:#5f6c7b;--muted-light:#8896a6;--primary:#0f172a;--primary-soft:#1d4ed8;--accent:#5b7cff;--glow:rgba(91,124,255,0.22);--success:#dff6e8;--success-text:#0c5d3c;--error:#fee2e2;--error-text:#991b1b;--shadow-sm:0 1px 3px rgba(15,23,42,0.06);--shadow:0 22px 60px rgba(15,23,42,0.12);--shadow-lg:0 34px 80px rgba(15,23,42,0.16);--radius:20px;--radius-lg:28px;--radius-xl:36px;--transition:0.25s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"SF Pro Display","SF Pro Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,rgba(91,124,255,0.10),transparent 34%),radial-gradient(circle at 90% 100%,rgba(15,23,42,0.07),transparent 28%),var(--bg);color:var(--text);line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{cursor:pointer;font:inherit;border:none;background:none}ul{list-style:none}
.container{width:min(1160px,calc(100% - 40px));margin:0 auto}
h1{font-size:clamp(2.6rem,5.2vw,4.8rem);line-height:1.02;letter-spacing:-0.065em;font-weight:800}
h2{font-size:clamp(1.9rem,3.2vw,2.8rem);line-height:1.08;letter-spacing:-0.055em;font-weight:700}
h3{font-size:clamp(1.15rem,1.6vw,1.4rem);line-height:1.2;letter-spacing:-0.035em;font-weight:700}
.topbar{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:rgba(245,247,251,0.68);border-bottom:1px solid rgba(15,23,42,0.06);transition:box-shadow var(--transition)}.topbar.scrolled{box-shadow:0 4px 24px rgba(15,23,42,0.08)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:74px;gap:16px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-0.05em;font-size:1.3rem;flex-shrink:0}
.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#0f172a,#1d4ed8 50%,#5b7cff);color:white;box-shadow:0 10px 24px rgba(76,104,255,0.4);font-size:0.85rem;font-weight:800}
.nav-links{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:0.93rem;font-weight:500}
.nav-links a{padding:8px 14px;border-radius:10px;transition:all var(--transition)}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--text);background:rgba(15,23,42,0.04)}
.nav-cta{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;font-weight:600;font-size:0.9rem;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;box-shadow:0 8px 24px rgba(29,78,216,0.25);transition:all var(--transition);white-space:nowrap;flex-shrink:0}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(29,78,216,0.35)}
.hamburger{display:none;flex-direction:column;gap:5px;padding:10px 8px;border-radius:10px;z-index:110}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:all var(--transition)}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;font-size:0.95rem;padding:14px 26px;transition:all var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#0f172a,#1d4ed8 50%,#5b7cff);color:white;box-shadow:0 18px 34px rgba(35,74,204,0.28)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 24px 44px rgba(35,74,204,0.38)}
.btn-secondary{background:rgba(255,255,255,0.82);border:1px solid var(--stroke);color:var(--text)}
.btn-secondary:hover{background:white;border-color:rgba(15,23,42,0.15);transform:translateY(-1px)}
.btn-lg{padding:16px 32px;font-size:1rem}
section{padding:96px 0}
.section-label{display:inline-block;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
.section-header{text-align:center;max-width:700px;margin:0 auto 56px}
.section-header h2{margin-bottom:16px}
.section-header p{color:var(--muted);font-size:1.08rem;line-height:1.6;max-width:560px;margin:0 auto}
.hero{padding:64px 0 56px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:52px;align-items:center}
.hero-text{max-width:620px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,0.72);border:1px solid var(--stroke);color:var(--muted);font-size:0.8rem;font-weight:600;margin-bottom:24px}
.hero-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#a5f3fc,#2563eb);box-shadow:0 0 0 5px rgba(59,130,246,0.15);animation:pulse-dot 2.5s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 5px rgba(59,130,246,0.15)}50%{box-shadow:0 0 0 12px rgba(59,130,246,0.04)}}
.hero h1{margin-bottom:22px}
.hero h1 .highlight{background:linear-gradient(135deg,#1d4ed8,#5b7cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-lead{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--muted);max-width:540px;margin-bottom:32px;line-height:1.55}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}
.hero-micro{color:var(--muted-light);font-size:0.9rem}
.hero-demo{background:linear-gradient(180deg,rgba(255,255,255,0.94),rgba(240,244,255,0.94));border:1px solid rgba(15,23,42,0.07);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:22px;position:relative;overflow:hidden}
.hero-demo::before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(91,124,255,0.08),transparent 70%);pointer-events:none}
.demo-header{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;background:rgba(255,255,255,0.7);border-radius:16px;border:1px solid rgba(15,23,42,0.05)}
.demo-header-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;animation:pulse-dot 2s ease-in-out infinite}
.demo-header-label{font-weight:600;font-size:0.85rem;color:var(--text)}
.demo-header-badge{font-size:0.7rem;padding:3px 10px;border-radius:999px;background:var(--success);color:var(--success-text);font-weight:600;margin-left:auto}
.chat-bubbles{position:relative;min-height:260px}
.chat-bubble{max-width:86%;border-radius:18px;padding:12px 15px;margin-bottom:10px;font-size:0.9rem;line-height:1.45;opacity:0;transform:translateY(12px);transition:all var(--transition);position:absolute;left:0}
.chat-bubble.visible{opacity:1;transform:translateY(0);position:relative}
.chat-bubble.incoming{background:rgba(255,255,255,0.95);color:var(--text);border-top-left-radius:6px;box-shadow:0 6px 16px rgba(15,23,42,0.04)}
.chat-bubble.outgoing{margin-left:auto;left:auto;right:0;background:linear-gradient(135deg,#dff6e8,#e8f8ef);color:var(--success-text);border-top-right-radius:6px}
.chat-bubble.system{margin:0 auto;left:50%;transform:translateX(-50%) translateY(12px);max-width:70%;background:rgba(239,246,255,0.9);color:var(--primary-soft);text-align:center;font-size:0.8rem;font-weight:600;border-radius:12px;padding:8px 16px}
.chat-bubble.system.visible{transform:translateX(-50%) translateY(0)}
.chat-bubble strong{display:block;margin-bottom:3px;font-size:0.78rem;color:var(--muted-light);font-weight:600}
.demo-status{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 16px;background:rgba(255,255,255,0.8);border-radius:14px;font-size:0.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-weight:600;font-size:0.78rem;transition:all var(--transition)}
.pill-ready{background:var(--success);color:var(--success-text)}.pill-published{background:#e0e7ff;color:#3730a3}.pill-default{background:rgba(15,23,42,0.04);color:var(--muted)}
.demo-label{position:absolute;top:-12px;right:20px;font-size:0.68rem;padding:4px 12px;background:rgba(255,255,255,0.9);border:1px solid var(--stroke);border-radius:999px;color:var(--muted);z-index:2;font-weight:500;backdrop-filter:blur(8px)}
</style>
</head>
<body>

<div class="container nav">

</nav>

</div>
</header>
